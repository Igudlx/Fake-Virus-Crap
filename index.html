<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Windows Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="desktop">
  <div id="taskbar">
    <div id="start-btn">Start</div>
    <div id="task-status">Ready</div>
  </div>

  <div id="desktop-area">
    <div class="file-icon" id="virus-file">
      <div class="icon-image">🦠</div>
      <div class="icon-label">virus.exe</div>
    </div>
  </div>

  <div id="context-menu" class="hidden">
    <div class="ctx-item" data-action="open">Open</div>
  </div>

  <div id="virus-overlay" class="hidden"></div>
  <div id="spawn-area"></div>

  <div id="hint">Double-click virus.exe or Right-click → Open</div>
</div>

<script src="js/virus.js"></script>
<script src="js/app.js"></script>

</body>
</html>
